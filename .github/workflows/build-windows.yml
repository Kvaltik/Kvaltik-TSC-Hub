name: Build Windows EXE

on:
  push:
    branches: [ "main", "feat/hub-2-foundation" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Test RailWorks path resolution
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /Fe:"build\railworks_path_tests.exe" tests\railworks_path_tests.cpp
          if errorlevel 1 exit /b 1
          build\railworks_path_tests.exe

      - name: Test telemetry and navigation
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /Fe:"build\telemetry_tests.exe" tests\telemetry_tests.cpp
          if errorlevel 1 exit /b 1
          build\telemetry_tests.exe

      - name: Build KvaltikTSCHub.exe
        shell: cmd
        run: |
          if not exist build mkdir build
          rc /nologo /fo "build\resource.res" resource.rc
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE /Fe:"build\KvaltikTSCHub.exe" main.cpp "build\resource.res" /link /SUBSYSTEM:WINDOWS user32.lib comctl32.lib shell32.lib gdi32.lib ole32.lib winhttp.lib advapi32.lib gdiplus.lib

      - name: Test Hub 2 storage and updates
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /DUNICODE /D_UNICODE /Fe:"build\core_tests.exe" tests\core_tests.cpp /link shell32.lib ole32.lib
          if errorlevel 1 exit /b 1
          build\core_tests.exe

      - name: Generate release checksum
        shell: pwsh
        run: |
          $digest = (Get-FileHash build/KvaltikTSCHub.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/build/KvaltikTSCHub.exe.sha256", $digest, [Text.UTF8Encoding]::new($false))

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KvaltikTSCHub-Windows-x64
          path: |
            build/KvaltikTSCHub.exe
            build/KvaltikTSCHub.exe.sha256
          if-no-files-found: error


  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download built EXE
        uses: actions/download-artifact@v4
        with:
          name: KvaltikTSCHub-Windows-x64
          path: release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "release/KvaltikTSCHub.exe" "release/KvaltikTSCHub.exe.sha256" --repo "${{ github.repository }}" --title "Kvaltík TSC Hub ${{ github.ref_name }}" --generate-notes
