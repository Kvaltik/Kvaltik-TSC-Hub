name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build KvaltikTSCHub.exe
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE /Fe:"build\KvaltikTSCHub.exe" main.cpp /link /SUBSYSTEM:WINDOWS user32.lib comctl32.lib shell32.lib

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KvaltikTSCHub-Windows-x64
          path: build/KvaltikTSCHub.exe
          if-no-files-found: error
