name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build KvaltikTSCHub.exe
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE /Fe:"build\KvaltikTSCHub.exe" main.cpp /link /SUBSYSTEM:WINDOWS user32.lib comctl32.lib shell32.lib gdi32.lib ole32.lib winhttp.lib advapi32.lib

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KvaltikTSCHub-Windows-x64
          path: build/KvaltikTSCHub.exe
          if-no-files-found: error


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download built EXE
        uses: actions/download-artifact@v4
        with:
          name: KvaltikTSCHub-Windows-x64
          path: release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "release/KvaltikTSCHub.exe" --title "Kvaltík TSC Hub ${{ github.ref_name }}" --generate-notes
